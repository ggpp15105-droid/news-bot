name: News Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут
  workflow_dispatch: {}      # кнопка ручного запуска

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install feedparser requests deep-translator

      - name: Запуск бота
        run: python news_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MM_EMAIL: ${{ secrets.MM_EMAIL }}

      - name: Сохранить список опубликованного
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted_news.txt
          git diff --cached --quiet || git commit -m "update posted [skip ci]"
          git pull --rebase origin main
          git push
